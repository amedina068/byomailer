# Self-host BYOMailer with Docker.
#
# 1. Copy .env.example to .env. Set APP_KEY, APP_URL, DB_PASSWORD, and DB_ROOT_PASSWORD.
# 2. Run `docker compose up -d --build`.
# 3. Run `docker compose logs web`. Open the setup URL from the log and
#    create the owner account.
#
# The web container runs the migrations when it starts (AUTORUN). Then it
# prints the setup URL while no account exists. To create the owner from the
# command line instead, run `docker compose exec web php artisan byomailer:install`.
#
# The `ses-events` worker reads SES events from SQS. It is in the `ses`
# profile because it needs AWS settings. Start it with
# `docker compose --profile ses up -d` after you set them.

x-app: &app
  build:
    context: .
    target: app
  image: ${BYOMAILER_IMAGE:-byomailer:local}
  restart: unless-stopped
  env_file:
    - path: ${BYOMAILER_ENV_FILE:-.env}
      required: false
  environment: &app-environment
    APP_ENV: ${APP_ENV:-production}
    APP_DEBUG: ${APP_DEBUG:-false}
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-byomailer}
    DB_USERNAME: ${DB_USERNAME:-byomailer}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: "null"
    QUEUE_CONNECTION: redis
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    LOG_CHANNEL: stderr
    INERTIA_SSR_ENABLED: "false"
  volumes:
    - storage:/var/www/html/storage/app
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      <<: *app-environment
      # Link storage, run migrations, and cache the config on each start.
      # Only this service does it, so the workers do not migrate too.
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION_ISOLATION: "true"
      # Prepare the instance and print the setup URL at start.
      BYOMAILER_PREPARE_ON_START: "true"
      HEALTHCHECK_PATH: /up
      PHP_OPCACHE_ENABLE: "1"
    healthcheck:
      # The first start runs every migration before NGINX starts.
      start_period: 600s

  horizon:
    <<: *app
    command: ["php", "artisan", "horizon"]
    stop_signal: SIGTERM
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "healthcheck-horizon"]
      start_period: 30s
    depends_on:
      web:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 10s
    depends_on:
      web:
        condition: service_healthy

  ses-events:
    <<: *app
    profiles: ["ses"]
    # Docker starts the poller again after each exit, also after a stop by
    # hand and a restart of the Docker daemon. When the poller does not run,
    # the SES events stay in SQS and the mails stay in the status sent.
    restart: always
    command: ["php", "artisan", "ses-events:poll"]
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "pgrep", "-f", "ses-events:poll"]
      start_period: 10s
    depends_on:
      web:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-byomailer}
      MYSQL_USER: ${DB_USERNAME:-byomailer}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  storage:
  mysql:
  redis:
