openapi: 3.1.2
info:
  title: BYOMailer
  version: 1.0.0
  description: |-
    The BYOMailer API manages the contacts, lists, newsletters, sequences and webhooks of one BYOMailer instance. Each instance has its own URL.

    Send a personal API token as a bearer token: `Authorization: Bearer <token>`. Make the token in Settings, API Tokens. A read-only token gets 403 on each request that changes data. Each request sees only the data of the client of the token user.

    List endpoints use cursor pagination. Send `per_page` (1 to 100, default 25) and the `cursor` from `meta.next_cursor` of the previous page.

    Errors use the HTTP status code and a JSON body with `message`. A 422 response also has `errors`, with the messages for each field. Each user can send 300 requests a minute (the `API_RATE_LIMIT` setting). Three endpoints have a lower limit. A request over a limit gets 429 with a `Retry-After` header.

    An unversioned `/api/<resource>` path answers 308 Permanent Redirect to `/api/v1/<resource>`.
servers:
  -
    url: 'https://byomailer.example/api/v1'
    description: Production
tags:
  -
    name: Contacts
    description: 'A contact is one email address of your client, with a name, tags, custom attributes and list memberships. In a create or update request, each body field that is not `email`, `name`, `tags` or `remove_tags` becomes a custom attribute.'
  -
    name: Lists
    description: 'A list groups contacts. When a list has opt-in, the contact gets a confirmation email and is subscribed only after the confirmation.'
  -
    name: Topics
    description: 'A topic is a subject inside one list. A contact subscribes to each topic of the list, and can unsubscribe from one topic on the preference page.'
  -
    name: Tags
    description: 'A tag labels contacts. Use tags to select the audience of a newsletter or a sequence.'
  -
    name: Newsletters
    description: 'A newsletter is one email to an audience of contacts. Create and edit drafts, schedule a send, pick the winner of an A/B test, and send a test email to yourself.'
  -
    name: Sequences
    description: 'A sequence is a series of emails. Each enrolled contact gets the steps on a schedule. The API reads sequences, steps and statistics, exports the mails of a step, and changes step filters and content variables.'
  -
    name: Blocks
    description: 'A block is a reusable piece of HTML content.'
  -
    name: 'Email templates'
    description: 'An email template is the HTML layout around the content of a newsletter or a sequence step. The API reads templates. Change them in the dashboard.'
  -
    name: 'Email identities'
    description: 'An email identity is a sender domain or a sender address in the Amazon SES account of your client. The API reads identities. Add them in the dashboard.'
  -
    name: 'Email logs'
    description: 'An email log is one record of the email activity of your client, for example one send, one bounce or one complaint.'
  -
    name: Projects
    description: 'A project groups newsletters, sequences and automations.'
  -
    name: Webhooks
    description: 'A webhook endpoint receives a signed `POST` request when an event occurs. Only an admin can manage webhook endpoints. Each delivery has the headers `X-Byomailer-Event`, `X-Byomailer-Delivery`, `X-Byomailer-Timestamp` and `X-Byomailer-Signature`. The signature is `sha256=` and the HMAC-SHA256 hex digest of the timestamp, a dot and the raw body, with the endpoint secret as the key.'
security:
  -
    http: []
paths:
  /contacts:
    get:
      operationId: v1.contacts.index
      description: |-
        Returns the contacts of your client, newest first. Unsubscribed contacts are
        left out unless `include_unsubscribed` is true. The filters `lists`, `tags`
        and `topics` each match a contact that has one of the given IDs.
      summary: 'List contacts'
      tags:
        - Contacts
      parameters:
        -
          name: 'lists[]'
          in: query
          description: 'Return only contacts on one of these list IDs.'
          schema:
            type: array
            items:
              type: integer
        -
          name: 'tags[]'
          in: query
          description: 'Return only contacts with one of these tag IDs.'
          schema:
            type: array
            items:
              type: integer
        -
          name: 'topics[]'
          in: query
          description: 'Return only contacts subscribed to one of these topic IDs.'
          schema:
            type: array
            items:
              type: integer
        -
          name: search
          in: query
          description: 'Return only contacts whose name or email contains this text.'
          schema:
            type: string
        -
          name: include_unsubscribed
          in: query
          description: 'Also return unsubscribed contacts.'
          schema:
            type: boolean
            default: false
        -
          name: per_page
          in: query
          description: 'The number of items on one page, from 1 to 100.'
          schema:
            type: integer
            default: 25
        -
          name: cursor
          in: query
          description: 'The cursor from `meta.next_cursor` or `meta.prev_cursor` of the previous response.'
          schema:
            type: string
      responses:
        200:
          description: 'Paginated set of `ContactResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContactResource'
                  links:
                    type: object
                    properties:
                      first:
                        type:
                          - string
                          - 'null'
                      last:
                        type:
                          - string
                          - 'null'
                      prev:
                        type:
                          - string
                          - 'null'
                      next:
                        type:
                          - string
                          - 'null'
                    required:
                      - first
                      - last
                      - prev
                      - next
                  meta:
                    type: object
                    properties:
                      path:
                        type:
                          - string
                          - 'null'
                        description: 'Base path for paginator generated URLs.'
                      per_page:
                        type: integer
                        description: 'Number of items shown per page.'
                        minimum: 0
                      next_cursor:
                        type:
                          - string
                          - 'null'
                        description: 'The "cursor" that points to the next set of items.'
                      prev_cursor:
                        type:
                          - string
                          - 'null'
                        description: 'The "cursor" that points to the previous set of items.'
                    required:
                      - path
                      - per_page
                      - next_cursor
                      - prev_cursor
                required:
                  - data
                  - links
                  - meta
        429:
          description: 'Too many requests'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: 'Error overview.'
                required:
                  - message
          headers:
            Retry-After:
              description: 'The number of seconds to wait before you send the request again.'
              schema:
                type: integer
        401:
          $ref: '#/components/responses/AuthenticationException'
        403:
          $ref: '#/components/responses/AuthorizationException'
  '/contacts/{contactId}':
    get:
      operationId: v1.contacts.show
      description: 'Returns one contact with its tags, lists, topics and sequences.'
      summary: 'Get a contact'
      tags:
        - Contacts
      parameters:
        -
          name: contactId
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: '`ContactResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ContactResource'
                required:
                  - data
        429:
          description: 'Too many requests'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: 'Error overview.'
                required:
                  - message
          headers:
            Retry-After:
              description: 'The number of seconds to wait before you send the request again.'
              schema:
                type: integer
        401:
          $ref: '#/components/responses/AuthenticationException'
        403:
          $ref: '#/components/responses/AuthorizationException'
        404:
          $ref: '#/components/responses/ModelNotFoundException'
    put:
      operationId: v1.contacts.update
      description: |-
        Changes the email, the name, the tags or the custom attributes of a contact.
        Only the fields in the request change. `tags` adds tags and `remove_tags`
        removes tags. Each other body field sets a custom attribute. An update never
        changes the subscription. To subscribe a contact again, use the subscribe
        endpoint or add the contact to a list.
      summary: 'Update a contact'
      tags:
        - Contacts
      parameters:
        -
          name: contactId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactRequest'
      responses:
        200:
          description: '`ContactResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ContactResource'
                required:
                  - data
        429:
          description: 'Too many requests'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: 'Error overview.'
                required:
                  - message
          headers:
            Retry-After:
              description: 'The number of seconds to wait before you send the request again.'
              schema:
                type: integer
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
        403:
          $ref: '#/components/responses/AuthorizationException'
    patch:
      operationId: v1.contacts.patch
      description: |-
        Changes the email, the name, the tags or the custom attributes of a contact.
        Only the fields in the request change. `tags` adds tags and `remove_tags`
        removes tags. Each other body field sets a custom attribute. An update never
        changes the subscription. To subscribe a contact again, use the subscribe
        endpoint or add the contact to a list.
      summary: 'Update a contact'
      tags:
        - Contacts
      parameters:
        -
          name: contactId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactRequest'
      responses:
        200:
          description: '`ContactResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ContactResource'
                required:
                  - data
        429:
          description: 'Too many requests'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: 'Error overview.'
                required:
                  - message
          headers:
            Retry-After:
              description: 'The number of seconds to wait before you send the request again.'
              schema:
                type: integer
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
        403:
          $ref: '#/components/responses/AuthorizationException'
  '/lists/{listId}/contacts':
    post:
      operationId: v1.lists.contacts.store
      description: |-
        Adds the contact with this email to the list. If the email is new, the
        contact is created and the response is 201. If the contact exists, it is
        updated and the response is 200. When the list has opt-in and the contact is
        new on the list, the contact gets a confirmation email. A newsletter or a
        sequence reaches the contact through this list only after it confirms. Tags
        in `tags` are created when they do not exist. A new contact with a
        blacklisted email gets 422.
        The request never changes the subscription. An unsubscribed contact stays
        unsubscribed. To subscribe it again, use the subscribe endpoint.
      summary: 'Add a contact to a list'
      tags:
        - Contacts
      parameters:
        -
          name: listId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactRequest'
      responses:
        200:
          description: 'The contact existed, and the request updated it.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ContactResource'
                required:
                  - data
        429:
          description: 'Too many requests'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: 'Error overview.'
                required:
                  - message
          headers:
            Retry-After:
              description: 'The number of seconds to wait before you send the request again.'
              schema:
                type: integer
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
        201:
          description: 'The contact is new.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ContactResource'
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
  '/contacts/{contactId}/unsubscribe':
    post:
      operationId: v1.contacts.unsubscribe
      description: |-
        Marks the contact as unsubscribed. The contact then gets no newsletters and
        no sequence emails. A second call keeps the first unsubscribe date.
      summary: 'Unsubscribe a contact'
      tags:
        - Contacts
      parameters:
        -
          name: contactId
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: '`ContactResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ContactResource'
                required:
                  - data
        429:
          description: 'Too many requests'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: 'Error overview.'
                required:
                  - message
          headers:
            Retry-After:
              description: 'The number of seconds to wait before you send the request again.'
              schema:
                type: integer
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        403:
          $ref: '#/components/responses/AuthorizationException'
  '/contacts/{contactId}/subscribe':
    post:
      operationId: v1.contacts.subscribe
      description: |-
        Clears an unsubscribe that an admin or the API made. The contact then gets
        newsletters and sequence emails again. A contact that unsubscribed through
        an email link gets 422. An address on the suppression list after a
        complaint, or on the global suppression list, gets 422. To remove a bounce
        suppression of your client, send `remove_suppression` as true. A subscribed
        contact does not change.
      summary: 'Subscribe a contact again'
      tags:
        - Contacts
      parameters:
        -
          name: contactId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                remove_suppression:
                  type: boolean
                  description: 'Remove the bounce suppression of the address. Without it, a suppressed address gets 422.'
      responses:
        200:
          description: '`ContactResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ContactResource'
                required:
                  - data
        429:
          description: 'Too many requests'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: 'Error overview.'
                required:
                  - message
          headers:
            Retry-After:
              description: 'The number of seconds to wait before you send the request again.'
              schema:
                type: integer
        422:
          description: 'The contact unsubscribed through an email link, or the address is on a suppression list that cannot be removed (`contact`). The address has a bounce suppression and `remove_suppression` is not true (`remove_suppression`).'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    properties:
                      contact:
                        type: array
                        items:
                          type: string
                      remove_suppression:
                        type: array
                        items:
                          type: string
                required:
                  - message
                  - errors
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        403:
          $ref: '#/components/responses/AuthorizationException'
  '/lists/{listId}/contacts/{contactId}':
    delete:
      operationId: v1.lists.contacts.destroy
      description: |-
        Removes the contact from one list. The contact stays in your client and on
        its other lists. The removal runs the live list automations of your client.
      summary: 'Remove a contact from a list'
      tags:
        - Contacts
      parameters:
        -
          name: listId
          in: path
          required: true
          schema:
            type: string
        -
          name: contactId
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: '`ContactResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ContactResource'
                required:
                  - data
        429:
          description: 'Too many requests'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: 'Error overview.'
                required:
                  - message
          headers:
            Retry-After:
              description: 'The number of seconds to wait before you send the request again.'
              schema:
                type: integer
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        403:
          $ref: '#/components/responses/AuthorizationException'
  /lists:
    get:
      operationId: v1.lists.index
      description: 'Returns the lists of your client, newest first.'
      summary: 'List lists'
      tags:
        - Lists
      parameters:
        -
          name: per_page
          in: query
          schema:
            type: integer
            minimum: 1.0
        -
          name: cursor
          in: query
          description: 'The cursor from `meta.next_cursor` or `meta.prev_cursor` of the previous response.'
          schema:
            type: string
      responses:
        200:
          description: 'Paginated set of `MailListResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MailListResource'
                  links:
                    type: object
                    properties:
                      first:
                        type:
                          - string
                          - 'null'
                      last:
                        type:
                          - string
                          - 'null'
                      prev:
                        type:
                          - string
                          - 'null'
                      next:
                        type:
                          - string
                          - 'null'
                    required:
                      - first
                      - last
                      - prev
                      - next
                  meta:
                    type: object
                    properties:
                      path:
                        type:
                          - string
                          - 'null'
                        description: 'Base path for paginator generated URLs.'
                      per_page:
                        type: integer
                        description: 'Number of items shown per page.'
                        minimum: 0
                      next_cursor:
                        type:
                          - string
                          - 'null'
                        description: 'The "cursor" that points to the next set of items.'
                      prev_cursor:
                        type:
                          - string
                          - 'null'
                        description: 'The "cursor" that points to the previous set of items.'
                    required:
                      - path
                      - per_page
                      - next_cursor
                      - prev_cursor
                required:
                  - data
                  - links
                  - meta
        429:
          description: 'Too many requests'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: 'Error overview.'
                required:
                  - message
          headers:
            Retry-After:
              description: 'The number of seconds to wait before you send the request again.'
              schema:
                type: integer
        422:
          $ref: '#/components/responses/ValidationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        403:
          $ref: '#/components/responses/AuthorizationException'
    post:
      operationId: v1.lists.store
      description: 'Creates a list with the given name. A list name is unique in your account.'
      summary: 'Create a list'
      tags:
        - Lists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailListRequest'
      responses:
        201:
          description: '`MailListResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MailListResource'
                required:
                  - data
        429:
          description: 'Too many requests'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: 'Error overview.'
                required:
                  - message
          headers:
            Retry-After:
              description: 'The number of seconds to wait before you send the request again.'
              schema:
                type: integer
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
        403:
          $ref: '#/components/responses/AuthorizationException'
  '/lists/{listId}':
    patch:
      operationId: v1.lists.update
      description: 'Changes the name of a list. A list name is unique in your account.'
      summary: 'Rename a list'
      tags:
        - Lists
      parameters:
        -
          name: listId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailListRequest'
      responses:
        200:
          description: '`MailListResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MailListResource'
                required:
                  - data
        429:
          description: 'Too many requests'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: 'Error overview.'
                required:
                  - message
          headers:
            Retry-After:
              description: 'The number of seconds to wait before you send the request again.'
              schema:
                type: integer
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
        403:
          $ref: '#/components/responses/AuthorizationException'
    delete:
      operationId: v1.lists.destroy
      description: |-
        Deletes the list and its topics. The contacts on the list are not
        deleted. When newsletters, sequences, segments or automations use the
        list or one of its topics, the request fails with 422 and names them.
      summary: 'Delete a list'
      tags:
        - Lists
      parameters:
        -
          name: listId
          in: path
          required: true
          schema:
            type: integer
      responses:
        204:
          description: 'No content'
        429:
          description: 'Too many requests'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: 'Error overview.'
                required:
                  - message
          headers:
            Retry-After:
              description: 'The number of seconds to wait before you send the request again.'
              schema:
                type: integer
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        422:
          $ref: '#/components/responses/ValidationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        403:
          $ref: '#/components/responses/AuthorizationException'
  '/lists/{listId}/topics':
    get:
      operationId: v1.lists.topics.index
      description: 'Returns the topics of one list, newest first.'
      summary: 'List the topics of a list'
      tags:
        - Topics
      parameters:
        -
          name: listId
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Array of `TopicResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TopicResource'
                required:
                  - data
        429:
          description: 'Too many requests'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: 'Error overview.'
                required:
                  - message
          headers:
            Retry-After:
              description: 'The number of seconds to wait before you send the request again.'
              schema:
                type: integer
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        403:
          $ref: '#/components/responses/AuthorizationException'
    post:
      operationId: v1.lists.topics.store
      description: |-
        Creates a topic in the list. Each contact on the list is subscribed to the
        new topic in the background.
      summary: 'Create a topic'
      tags:
        - Topics
      parameters:
        -
          name: listId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicRequest'
      responses:
        201:
          description: '`TopicResource`'
          content:
