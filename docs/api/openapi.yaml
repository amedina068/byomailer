        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
  '/webhook-endpoints/{webhookEndpointId}/secret':
    post:
      operationId: v1.webhook-endpoints.secret
      description: |-
        Makes a new signing secret and returns it. The old secret stops working at
        once. Only an admin can call this endpoint.
      summary: 'Rotate the secret of a webhook endpoint'
      tags:
        - Webhooks
      parameters:
        -
          name: webhookEndpointId
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: '`WebhookEndpointResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WebhookEndpointResource'
                required:
                  - data
        403:
