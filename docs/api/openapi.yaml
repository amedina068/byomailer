  '/webhook-endpoints/{webhookEndpointId}/test':
    post:
      operationId: v1.webhook-endpoints.test
      description: |-
        Queues a `webhook.test` delivery to the endpoint and returns it with the
        status 202. Only an admin can call this endpoint. The limit is 10 requests a
        minute for each client.
      summary: 'Send a test delivery'
      tags:
        - Webhooks
      parameters:
        -
          name: webhookEndpointId
          in: path
          required: true
          schema:
            type: integer
      responses:
        202:
          description: '`WebhookDeliveryResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WebhookDeliveryResource'
                required:
                  - data
        403:
