; Runs the BYOMailer background processes with Supervisor, without Docker.
; Use this file or the systemd units in deploy/systemd/, not both.
;
; Replace /var/www/byomailer with the folder of the app, and www-data with
; the user of PHP-FPM.
;
; Install:
;   sudo cp byomailer.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread
;   sudo supervisorctl update
;
; After a deploy, run `php artisan horizon:terminate` and
; `php artisan queue:restart`. Supervisor starts the processes again.

; Queue workers. Horizon processes all the queues of the app.
; A newsletter job can run for 300 seconds.
[program:byomailer-horizon]
command=/usr/bin/php /var/www/byomailer/artisan horizon
directory=/var/www/byomailer
user=www-data
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=330
redirect_stderr=true
stdout_logfile=/var/www/byomailer/storage/logs/horizon.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; The scheduler. Run only one for each instance.
[program:byomailer-scheduler]
command=/usr/bin/php /var/www/byomailer/artisan schedule:work
directory=/var/www/byomailer
user=www-data
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/www/byomailer/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; The SES events worker. It needs PLATFORM_AWS_* and SES_EVENTS_SQS_QUEUE_URL.
; It stops with exit code 0 at 256 MB and after queue:restart.
; autorestart=true starts it again.
[program:byomailer-ses-events]
command=/usr/bin/php /var/www/byomailer/artisan ses-events:poll
directory=/var/www/byomailer
user=www-data
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/www/byomailer/storage/logs/ses-events.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
