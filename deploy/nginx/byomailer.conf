# NGINX server block for BYOMailer without Docker (PHP-FPM).
#
# Replace these values before you use the file:
#   byomailer.example                   The host of APP_URL.
#   /var/www/byomailer                  The folder of the app.
#   /run/php/php8.4-fpm.sock            The PHP-FPM socket of PHP 8.4.
#   /etc/letsencrypt/live/...           The certificate files of the host.
#
# Put the file in /etc/nginx/sites-available/, link it in sites-enabled/,
# then run `nginx -t` and reload NGINX.

server {
    listen 80;
    listen [::]:80;
    server_name byomailer.example;

    return 301 https://$host$request_uri;
}

server {
    # default_server: with Cloudflare for SaaS, the requests of a custom link
    # domain arrive with the Host of that domain. The app accepts the host of
    # APP_URL and the verified link domains, and answers 404 to other hosts.
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name byomailer.example;

    ssl_certificate     /etc/letsencrypt/live/byomailer.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/byomailer.example/privkey.pem;

    root /var/www/byomailer/public;
    index index.php;
    charset utf-8;

    # The contact import accepts files of 20 MB.
    client_max_body_size 25m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite writes the assets with a hash in the file name.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
