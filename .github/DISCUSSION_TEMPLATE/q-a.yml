body:
  - type: markdown
    attributes:
      value: |
        Search the old discussions and the [documentation](https://byomailer.com/docs) before you ask.
        Do not report a security problem here. Read SECURITY.md and report it in private.
        Remove AWS keys, tokens, passwords and contact email addresses before you paste a log.
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag, the image tag or the commit. For a Docker image, run `docker compose images web`. For a checkout, run `git rev-parse --short HEAD`.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - Docker image from GHCR (docker-compose.image.yml)
        - Docker Compose, built from source (docker-compose.yml)
        - Local install (composer dev, Valet, Herd or similar)
        - Other
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Write what you want to do, what you tried and what occurred.
    validations:
      required: true
