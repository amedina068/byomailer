name: GitHub release

# A push of a "v*" tag creates the GitHub release of that tag. The notes are
# the section of CHANGELOG.md for the version, for example "## [1.2.0]".
# Run scripts/changelog-release.sh and set the version heading before you
# push the tag. If the release exists, the job changes nothing.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create the GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "The release $TAG exists. Nothing to do."
            exit 0
          fi

          version="${TAG#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no section '## [$version]' with entries."
            exit 1
          fi

          # A version with a suffix, for example 1.3.0-rc.1, is a pre-release.
          prerelease=()
          if [[ "$version" == *-* ]]; then
            prerelease=(--prerelease)
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --verify-tag \
            "${prerelease[@]}"
